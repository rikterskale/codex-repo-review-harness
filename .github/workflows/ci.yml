name: Harness Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  {}

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          # Validate-Release.ps1 checks the guides against a digest of the
          # working tree, so it needs no history at all.
          fetch-depth: 1

      - name: Run structural and regression tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_harness_structure.ps1

      - name: Run 100% of regression tests
        shell: pwsh
        run: |
          # A child pwsh exiting non-zero is not a PowerShell error, so
          # $ErrorActionPreference does not stop this block, and the step's exit
          # status is only taken from the LAST command. Listing the scripts and
          # checking $LASTEXITCODE after each one is what makes every failure
          # visible; running them all before exiting reports every failure in a
          # single run instead of only the first.
          $checks = @(Get-ChildItem -LiteralPath tests -Filter 'test_*.ps1' -File |
            Sort-Object Name | ForEach-Object { $_.FullName })
          $failed = @()
          foreach ($check in $checks) {
            Write-Host "::group::$($check)"
            pwsh -NoProfile -File $check
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              $failed += "$($check) (exit $($code))"
              Write-Host "::error file=$($check)::$($check) failed with exit code $($code)"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAIL: $($failed.Count) of $($checks.Count) checks failed:"
            $failed | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "PASS: all $($checks.Count) checks succeeded."
          exit 0

      - name: Enforce 100% production-source coverage
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Test-SourceCoverage.ps1 -MinimumCoverage 100

      # Coverage is useful supporting signal, but it cannot establish that a
      # first-time user can install, use, troubleshoot, and recover the
      # harness. The gates below are the requirements in
      # docs/RELEASE_READINESS_STANDARD.md, one named step each, so a red build
      # names the requirement that broke rather than a test file. Each runs on
      # every platform in the matrix; evidence from one never covers the other.
      # Test-ReleaseReadiness.ps1 reads this file back and fails if any of these
      # steps is deleted, renamed off its evidence script, made
      # continue-on-error, or made conditional.
      - name: 'RR-01/02/03: prove clean new-user installation, first review, and target safety'
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_new_user_journey.ps1

      - name: 'RR-04: prove clean-room installation and upgrade'
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_clean_room.ps1

      - name: 'RR-05: validate the complete user-facing feature set'
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test_runner_failure.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test_review_artifacts.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test_security_regressions.ps1
          exit $LASTEXITCODE

      - name: 'RR-06: exercise installation recovery and safe removal'
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_recovery_paths.ps1

      - name: 'RR-08: verify release documentation against this tree'
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test_guide_digest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/ci/Validate-Release.ps1
          exit $LASTEXITCODE

      # Last, so it reports on the workflow that actually ran the gates above.
      - name: 'RR-07/09/10: enforce the new-user release-readiness standard'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Test-ReleaseReadiness.ps1

      - name: Validate PowerShell syntax
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Test-PowerShellSyntax.ps1
