name: Harness Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  {}

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          # Validate-Release.ps1 accepts a tip commit or its parent as the
          # guides' reviewed_head, so that a metadata-update commit can record
          # the content commit it reviewed. The default depth-1 checkout cannot
          # resolve the parent, which made that pattern impossible to satisfy.
          # On push, depth 2 covers HEAD and HEAD~1. On pull_request the checkout
          # is a merge commit, and the pull request head's parent is two steps
          # further out: merge (1), its parents (2), their parents (3).
          fetch-depth: 3

      - name: Run structural and regression tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_harness_structure.ps1

      - name: Validate reports, release metadata, and workflow policy
        shell: pwsh
        env:
          # Passed as an environment variable rather than interpolated into the
          # script body. Empty on push events, which is the intended signal.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A child pwsh exiting non-zero is not a PowerShell error, so
          # $ErrorActionPreference does not stop this block, and the step's exit
          # status is only taken from the LAST command. Listing the scripts and
          # checking $LASTEXITCODE after each one is what makes every failure
          # visible; running them all before exiting reports every failure in a
          # single run instead of only the first.
          $checks = @(
            'scripts/ci/Test-ReportContract.ps1',
            'tests/test_review_artifacts.ps1',
            'tests/test_security_regressions.ps1',
            'tests/test_review_helpers.ps1',
            'tests/test_report_consistency.ps1',
            'tests/test_unicode_output.ps1',
            'tests/test_runner_failure.ps1',
            'tests/test_batch2_regressions.ps1',
            'tests/test_clean_room.ps1',
            'tests/test_release_pr_metadata.ps1',
            'scripts/ci/Validate-Release.ps1',
            'scripts/ci/Validate-WorkflowPolicy.ps1',
            'scripts/ci/Test-GeneratedArtifacts.ps1'
          )
          $failed = @()
          foreach ($check in $checks) {
            Write-Host "::group::$($check)"
            pwsh -NoProfile -File $check
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              $failed += "$($check) (exit $($code))"
              Write-Host "::error file=$($check)::$($check) failed with exit code $($code)"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAIL: $($failed.Count) of $($checks.Count) checks failed:"
            $failed | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "PASS: all $($checks.Count) checks succeeded."
          exit 0

      - name: Validate PowerShell syntax
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Test-PowerShellSyntax.ps1
